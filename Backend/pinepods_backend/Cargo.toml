[package]
name = "pinepods_backend"
version = "0.9.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "rustls", "query"] }
env_logger = "0.11.11"
log = "0.4.34"
dotenvy = "0.15.7"
sha1 = "0.11.0"
urlencoding = "2.1.3"
actix-cors = "0.7.2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["process"] }
