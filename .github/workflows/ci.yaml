name: Pinepods CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Backend (rust-api) tests live in rust-api-tests.yml.

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: 1.99
          targets: wasm32-unknown-unknown

      # Install cargo-binstall for other OSes using the standard method
      - name: Install cargo-binstall
        if: matrix.os != 'macos-latest'
        uses: cargo-bins/cargo-binstall@main

      - name: Depends install
        if: ${{ env.DEPENDS_SETUP == 'true' }}
        run: |
          sudo apt update
          sudo apt install -qy libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: wasm-addition
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          cargo binstall wasm-pack -y

      - name: Run frontend tests
        working-directory: ./web
        run: |
          RUSTFLAGS="--cfg=web_sys_unstable_apis" wasm-pack test --node -- --features server_build

