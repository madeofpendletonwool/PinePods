[package]
name = "pinepods-api"
version = "0.9.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
# Web Framework
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# OpenAPI / API documentation (compile-time spec generation)
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "chrono", "json", "bigdecimal"] }
bigdecimal = "0.4.11"

# Redis/Valkey
redis = { version = "1.7.1", features = ["aio", "tokio-comp", "connection-manager"] }

# HTTP Client
reqwest = { version = "0.13.5", features = ["json", "stream", "cookies", "query", "form"] }

# Configuration and Environment
config = "0.15.27"
dotenvy = "0.15.7"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
thiserror = "2.0.21"
async-trait = "0.1.92"
base64 = "0.23.1"
lazy_static = "1.5.1"
urlencoding = "2.1.3"

# Authentication and Crypto
argon2 = "0.6.0"
rand = "0.10.3"

# MFA/TOTP Support
totp-rs = { version = "6.0.0", features = ["otpauth"] }
qrcode = "0.14.1"

# Encryption for sync credentials
fernet = "0.2.2"

# RSS/Feed Processing
feed-rs = "3.0.0"
url = "2.5.8"
regex = "1.13.1"

# Audio metadata tagging
id3 = "1.17.2"
mp3-metadata = "0.4.0"
quick-xml = "0.42.0"
unicode-normalization = "0.1.26"
sha2 = "0.10.9"
hex = "0.4.3"

# Email
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# Background Tasks and Task Management
tokio-cron-scheduler = "0.15.1"
croner = "4.0.1"
futures = "0.3.34"

# WebSocket Support (already in axum features)

# File handling
tokio-util = { version = "0.7.20", features = ["io"] }

[features]
# Test-only hooks (e.g. letting the SSRF guard reach the loopback fixture server).
# Enabled automatically for `cargo test` via the self dev-dependency below.
test-support = []

[dev-dependencies]
tower-test = "0.4"
pinepods-api = { path = ".", features = ["test-support"] }
# Integration harness (tests/integration). Same versions as the main dependency set.
http-body-util = "0.1"
